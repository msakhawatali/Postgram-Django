{% extends "base_profile.html" %}
{% load static %}

{% block title %}Add Post{% endblock title %}

{% block profile %}
<link rel="stylesheet" href="/static/css/add_post.css">

<div class="handel_div">
    <h3 class="manage_header">Upload & Share</h3>

    <div>
        <nav>
            <div class="nav nav-tabs tab_bar" id="nav-tab" role="tablist">
                <button class="nav-link active bar_hedaer" id="nav-home-tab" data-bs-toggle="tab" data-bs-target="#nav-home" type="button" role="tab" aria-controls="nav-home" aria-selected="true">
                    <h3>📷 Image Post</h3>
                </button>
                <button class="nav-link bar_hedaer" id="nav-profile-tab" data-bs-toggle="tab" data-bs-target="#nav-profile" type="button" role="tab" aria-controls="nav-profile" aria-selected="false">
                    <h3>✍️ Post Quote</h3>
                </button>
            </div>
        </nav>

        <div class="tab-content" id="nav-tabContent">
            <div class="tab-pane fade show active" id="nav-home" role="tabpanel" aria-labelledby="nav-home-tab" tabindex="0">
                <div class="card border-0">
                    <div class="card-body hanel_body">
                        <h5 class="card-title text-center font-weight-bold mb-4" style="color: #1F2937;">Upload an Image Post</h5>
                        
                        <form action="/profile/upload-image-to-db" method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">Upload Image</label>
                                <input name="img" type="file" class="dropify form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Add Tags</label>
                                <input name="tag" type="text" class="form-control" placeholder="e.g. photography, travel, nature">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Visibility</label>
                                <select class="form-select" name="visibility">
                                    <option value="public">Public</option>
                                    <option value="private">Private</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Caption / Description</label>
                                <textarea name="desc" class="form-control" rows="3" placeholder="Describe about your post.."></textarea>
                            </div>

                            <div class="text-center mt-4">
                                <button class="btn btn-primary upload_post" type="submit">Upload Post</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="nav-profile" role="tabpanel" aria-labelledby="nav-profile-tab" tabindex="0">
                <div class="card border-0">
                    <div class="card-body hanel_body">
                        <h5 class="card-title text-center font-weight-bold mb-4" style="color: #1F2937;">Post a Quote or Idea</h5>
                        
                        <form action="/profile/upload-post-to-db" method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">Write a Quote</label>
                                <textarea name="post" class="form-control" rows="3" placeholder="Write your thoughts, idea or inspiring quote..." required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description / Context</label>
                                <textarea name="desc" class="form-control" rows="2" placeholder="Additional details about your post.."></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Visibility</label>
                                <select class="form-select" name="visibility">
                                    <option value="public">Public</option>
                                    <option value="private">Private</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Add Tags</label>
                                <input name="tag" type="text" class="form-control" placeholder="e.g. motivation, thoughts">
                            </div>

                            <div class="text-center mt-4">
                                <button class="btn btn-primary upload_post" type="submit">Upload Quote</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock profile %}
